defaults:
  - model_checkpoint
  - model_summary
  - tqdm_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: 'model-epoch={epoch:03d}-step={step:06d}'
  monitor: null
  save_top_k: -1
  save_last: true
  every_n_train_steps: 200
  auto_insert_metric_name: false

ema:
  _target_: src.callbacks.ema.EMA
  decay: 0.99
