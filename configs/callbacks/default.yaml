defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - tqdm_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/loss"
  mode: "min"
  save_top_k: 1
  save_last: True
  auto_insert_metric_name: True

early_stopping:
  monitor: "val/loss"
  mode: "min"
  patience: 100

model_summary:
  max_depth: 1
